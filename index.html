for(let i=0;i<hc;i++){const x=1+(i%c)*2,y=1+(i/c|0)*2.4;L.seat.push([x+.5,y+1.15]);L.O.push([x,y,1,.9,12,i<9?'#cdb78f':'#d9c7a3'],[x+.25,y+.2,.5,.1,10,'#4a90d9',12,'m'],[x+.3,y+1,.4,.4,6,'#3b5fb0'])}

[.5,5.5,2,1,12,'#444'],[.8,5.6,.6,.1,10,'#4a90d9',12,'m'],[1.6,5.6,.6,.1,10,'#4a90d9',12,'m'],[.9,6.9,.4,.4,6,'#222'],[5,5.8,.3,2,24,'#111'],[8,5.8,1,2.4,10,'#2f5fd0'],[9,5.8,.3,2.4,22,'#254bb0'],[3.6,.4,.5,.5,20,'#2f9e4f']);

/* ---- simulation ---- */
function tick(){const o=S.t;S.t+=10;const h=hour();if(h>=9&&h<17){const pr=prodF();S.projs.forEach(p=>{if(!p.done){p.prog+=rate(p)*pr/48;if(p.prog>=p.size)finish(p)}})}if((o/1440|0)!=(S.t/1440|0))newDay()}

if(Math.random()<.08&&hc){const e=rnd(S.staff);if(!S.leaves.some(l=>l.uid==e.uid&&l.st=='pending'))S.leaves.push({id:++S.nid,uid:e.uid,name:e.name,from:d+2+(Math.random()*4|0),days:2+(Math.random()*4|0),st:'pending',why:rnd(['Vacation','Family matter','Medical'])})}
rels();if(S.fam.pending&&d>=S.fam.pending){const k={uid:uid(),name:rnd(NAMES),look:[rnd(SKIN),rnd(HAIR),rnd(SHIRT)]};S.fam.kids.push(k);S.fam.pending=0;PP.push(mkP('kid',k,0,1));say('Your family welcomed a baby: '+k.name+'!');tip('A baby was born in your family!')}

function rels(){const all=[...S.dirs,...S.staff];if(Math.random()<.06){const f=all.filter(e=>!S.rels.some(r=>r.a==e.uid||r.b==e.uid)),a=rnd(f),b=rnd(f);if(f.length>1&&a!=b){S.rels.push({a:a.uid,b:b.uid,an:a.name,bn:b.name,t:'dating',since:day(),kids:0});say(a.name+' and '+b.name+' started dating.')}}

brief(v){const e=[S.ceo,...S.dirs][v];e.say=SAY[e.sty]+' (happiness '+(S.hap|0)+', cash '+$f(S.cash)+')';R()},
rok(v){const q=S.queue.find(x=>x.id==v);if(S.cash<q.cost)return alert('Not enough company cash.');applyR(q);S.queue=S.queue.filter(x=>x!=q);say('You approved: '+q.t);R();ui()},rno(v){S.queue=S.queue.filter(x=>x.id!=v);R()},
lok(v){S.leaves.find(l=>l.id==v).st='ok';say('Leave approved.');R()},lno(v){S.leaves=S.leaves.filter(l=>l.id!=v);R()},
hire(v){const r=S.recs.find(x=>x.id==v);hireN(1,r.dept);S.staff[S.staff.length-1].name=r.name;PP[PP.length-1]&&0;sync();S.recs=[];say('Hired '+r.name+' for '+DEPT[r.dept][0]+'.');R()},
addev(){const t=$('#et').value;if(!t)return alert('Enter a title.');S.events.push({day:val_('#ed'),title:t,type:$('#ey').value});R()},
grant(){const u=$('#lw').value,e=[...S.dirs,...S.staff].find(x=>x.uid==u);S.leaves.push({id:++S.nid,uid:u,name:u=='me'?'You':e.name,from:val_('#lf'),days:Math.max(1,val_('#ld')),st:'ok',why:'Granted'});say('Leave granted.');R();ui()},
fam(v){const f=S.fam;if(v=='time'){f.bond=cl(f.bond+4);S.hap=cl(S.hap+2)}if(v=='date'){f.bond=cl(f.bond+6);S.hap=cl(S.hap+2)}if(v=='baby'){if(f.pending||f.kids.length>=5)return alert('Not possible right now.');f.pending=day()+6;say('You and '+f.partner.name+' are expecting a baby.')}R();ui()},
enter(v){if(S.mt)return;const d=S.queue.find(q=>q.id==v);S.mt={d,ph:'enter',info:false};const B=lay('board');S.board.forEach((b,i)=>{const p=mkP('board',b,i);p.in=1;p.room='board';[p.x,p.y]=B.door;p.g=G('board',B.seat[i],'talk',1);PP.push(p)});tab='board';view='board';R()},
bd(v){const m=S.mt,d=m.d;if(v=='i'){m.info=true;return R()}if(v=='y'){if(S.cash<d.cost)return alert('Insufficient cash. Consider a loan first.');applyB(d);S.queue=S.queue.filter(q=>q!=d)}
if(v=='n'){S.queue=S.queue.filter(q=>q!=d);say('Board rejected: '+d.t)}if(v=='d'){d.avail=day()+3;say('Decision delayed.')}if(v=='r'){d.cost=Math.round(d.cost*.85);d.risk*=.8;d.avail=day()+5;say('Sent back for revision.')}endMt()},
save(){save();alert('Saved.')},export(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='tycoon-save.json';a.click()},
newg(){if(confirm('Delete your save and start over?')){localStorage.removeItem(KEY);creator()}},start(){mk({name:$('#cn').value||'Alex',co:$('#cc').value||'Bright Corp'});$('#modal').style.display='none';R();ui()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.v)});
function save(){try{const m=S.mt;S.mt=null;localStorage.setItem(KEY,JSON.stringify(S));S.mt=m}catch(e){}}
function creator(){$('#modal').style.display='flex';$('#modal').innerHTML=`<div class=mbox><h2>Office & Life Tycoon</h2><p>You are the President and owner. You also have a home and a family.</p><input id=cn placeholder="Your name"><input id=cc placeholder="Company name">${btn('start','','Take office','g')}</div>`}
function loop(ts){const dt=Math.min(.1,(ts-last)/1000);last=ts;if(S){if(!paused){acc+=dt*spd;while(acc>=2){acc-=2;tick();ui()}move(dt)}}draw(ts/1000);requestAnimationFrame(loop)}
try{const d=localStorage.getItem(KEY);if(d){S=JSON.parse(d);S.mt=null;sync();R();ui()}else creator()}catch(e){creator()}
requestAnimationFrame(loop);
</script></body></html>
