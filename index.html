<span>\uD83D\uDCB0 ${$f(S.cash)} \u00B7 Value ${$f(val())} \u00B7 Rep ${S.rep|0}</span>${bar('Happy',S.hap,'#3c6')}${bar('Prod',prodF()*100/1.3,'#4ac')}`}

<h4>Organization</h4><div class=card>President (you) \u2192 Board (6) \u2192 CEO ${esc(S.ceo.name)} \u2192 8 Directors \u2192 ${Math.ceil((S.staff.length+S.remote)/5)} Supervisors \u2192 ${S.staff.length+S.remote} staff (${S.remote} at branches)</div>`},

const cf=S.dirs[2],dis=q.cost>S.cash*.05?`<br><small>${esc(cf.name)} (CFO) dissents: "${cf.sty=='bold'?'Acceptable, but watch the budget.':'I would hold until cash is healthier.'}"</small>`:'';
return`<div class=card><b>${esc(q.t)}</b><br><small>${q.from} \u00B7 Cost ${$f(q.cost)} \u00B7 CEO: "I recommend approval."</small>${dis}<br>${btn('rok',q.id,'Approve','g')}${btn('rno',q.id,'Reject','r')}</div>`}).join('')||'<p>No pending decisions.</p>')+'<h4>Company messages</h4>'+S.log.map(m=>`<div class=msg>${esc(m)}</div>`).join(''),
exec:()=>[S.ceo,...S.dirs].map((e,i)=>`<div class=card><b>${esc(e.name)}</b> \u00B7 ${e.role}<br><small>Style ${e.sty} \u00B7 Risk tolerance ${e.risk} \u00B7 Strength: ${e.str} \u00B7 Weakness: ${e.weak}</small><br>${btn('brief',i,'Ask for report')}${e.say?`<div class=msg>"${esc(e.say)}"</div>`:''}</div>`).join(''),
board:()=>{const m=S.mt;if(!m)return'<h3>Board of Directors</h3>'+S.board.map(b=>`<div class=card><b>${esc(b.name)}</b> \u00B7 ${b.title}<br><small>Style ${b.sty} \u00B7 Risk ${b.risk}</small></div>`).join('');
const d=m.d;if(m.ph=='enter')return`<h3>Board Room</h3><p>Board members are walking in\u2026</p>`;const o=opin(d),f=o.filter(x=>x.v>0).length,ag=o.filter(x=>x.v<0).length;
return`<h3>${esc(d.t)}</h3><div class=card><b>CEO ${esc(S.ceo.name)} presents</b><br>Situation: ${d.sit}<br>Cost: ${d.cost<0?'Brings in '+$f(-d.cost):$f(d.cost)}<br>Benefits: ${d.rev?'+'+$f(d.rev)+'/mo revenue. ':''}${d.hire?'+'+d.hire+' staff. ':''}${d.asset?'+'+$f(d.asset)+' assets. ':''}${d.prod?'+productivity. ':''}Growth ${d.gr*100|0}%<br>Risks: ${d.risk*100|0}%${d.legal?', regulatory issues':''}${d.intr?', interest '+$f(d.intr)+'/mo':''}<br>Alternatives: ${d.alt}${m.info?`<br><b>More info:</b> success chance ${100-(d.risk*45|0)}%, payback ${d.rev?Math.ceil(d.cost/d.rev)+' months':'n/a'}.`:''}</div>
${o.map(x=>`<div class=msg><b>${esc(x.m.name)}</b> (${x.m.title}): "${x.t}"</div>`).join('')}<p><small>Board leaning: ${f} for, ${ag} against.</small></p>${btn('bd','y','Approve','g')}${btn('bd','n','Reject','r')}${btn('bd','d','Delay')}${m.info?'':btn('bd','i','More information')}${btn('bd','r','Send back for revision')}`},
fin:()=>{const r=S.rpt,hc=S.staff.length+S.remote;return`<h3>Finance</h3><div class=card>Cash <b>${$f(S.cash)}</b> \u00B7 Valuation <b>${$f(val())}</b><br>Monthly revenue ~${$f(r.rev*30)} \u00B7 expenses ~${$f(r.exp*30)}<br>Headcount ${hc+9} \u00B7 Loans ${$f(S.debt)} \u00B7 Assets ${$f(S.assets)}<br><small>Payroll, rent and interest are paid daily by Finance.</small></div>`},

const TABS=[['dash','Report'],['inbox','Inbox'],['board','Board'],['exec','Executives'],['fin','Finance'],['set','Settings']];
function R(){if(!S)return;$('#tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k==tab?'on':''}" data-a=tab data-v=${k}>${l}${k=='inbox'&&S.queue.length?' ('+S.queue.length+')':''}</button>`).join('');$('#panel').innerHTML=V[tab]()}
